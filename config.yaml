  - url: https://flareprox-1788669654-httttt.frontlane-studio.workers.dev
    tags:
    - flareprox
    - cf
    - rotating
  health:
    failure_threshold: 2
  lanes:
    enabled: true
    max_lanes: 100
    drop_cookies_on_challenge: true
cache:
  ttl_seconds: 120
  max_size: 1000
resilience:
  max_retries: 1
  allow_endpoint_fallback: false
circuit_breaker: null
cors:
  enabled: true
  allow_origins: '*'
  allow_methods: GET, POST, OPTIONS
