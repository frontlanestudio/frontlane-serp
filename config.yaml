server:
  host: 0.0.0.0
  port: 7000
  debug: false
  verbose: false
  raw_requests: true
  insecure: true
app:
  log_format: text
  timeout: 15
  # Route page extraction and crawling requests through a browser TLS/HTTP2
  # fingerprint (JA3/JA4) impersonation client so they aren't distinguishable
  # from real Chrome at the TLS handshake level (search engine scraping is
  # unaffected either way). Falls back to the plain HTTP client automatically
  # if the impersonating client can't be built or a request through it fails.
  # Not available on Windows builds. See src/core/impersonate.rs.
  browser_impersonation: true
  browser_path: ''
  profiles: ''
  head: false
  leakless: false
  leave_head: false
  block_resources: image,font,css,media
  block_trackers: true
  max_processes: 6
  idle_ttl: 5m
  mega_timeout: 90s
extract:
  enabled: true
  default_mode: auto
  timeout: 20s
  max_bytes: 2000000
  max_concurrent: 2
proxies:
  allow_request_proxy_url: true
  global: null
  entries:
  - url: https://flareprox-1788669654-httttt.frontlane-studio.workers.dev
    tags:
    - flareprox
    - cf
    - rotating
  health:
    failure_threshold: 2
  lanes:
    enabled: true
    max_lanes: 100
    drop_cookies_on_challenge: true
cache:
  ttl_seconds: 120
  max_size: 1000
resilience:
  max_retries: 1
  allow_endpoint_fallback: false
circuit_breaker: null
cors:
  enabled: true
  allow_origins: '*'
  allow_methods: GET, POST, OPTIONS
  allow_headers: Origin, Content-Type, Accept, Authorization, X-Use-Proxy, X-Proxy-URL, X-Proxy-Country, X-Proxy-Class, X-Proxy-Provider, X-Proxy-Session-ID, X-Request-ID, X-Tenant, X-Use-Profile
  max_age: 86400
# Same solver/provider/key handles Cloudflare's Turnstile (extraction and
# crawling requests, resolved automatically into a reusable cf_clearance
# cookie -- see app.browser_impersonation above) as well as reCAPTCHA v2/v3
# and hCaptcha challenges detected directly on a page. Provider is
# "capsolver" or "2captcha" -- unlike Turnstile, a solved reCAPTCHA/hCaptcha
# token isn't reusable and has to be submitted to whatever the page itself
# expects; see ExtractedContent.captcha_challenge / .captcha_site_key /
# .captcha_token in the extract/crawl API response.
captcha:
  solver_enabled: false
  provider: capsolver
  apikey: null
flareprox:
  enabled: true
  api_token: null
  account_id: null
  worker_prefix: flareprox
  workers:
  - https://flareprox-1788669654-httttt.frontlane-studio.workers.dev
yandex:
  rate_requests: 60
  rate_burst: 3
  proxy: null
  captcha: null
