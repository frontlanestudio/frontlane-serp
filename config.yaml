server:
  host: 0.0.0.0
  port: 7000
  debug: false
  verbose: false
  raw_requests: true
  insecure: true
app:
  log_format: text
  timeout: 15
  browser_path: ''
  profiles: ''
  head: false
  leakless: false
  leave_head: false
  block_resources: image,font,css,media
  block_trackers: true
  max_processes: 6
  idle_ttl: 5m
  mega_timeout: 90s
extract:
  enabled: true
  default_mode: auto
  timeout: 20s
  max_bytes: 2000000
  max_concurrent: 2
proxies:
  allow_request_proxy_url: true
  global: null
