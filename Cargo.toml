[package]
name = "frontlane-serp"
version = "0.1.0"
edition = "2021"
authors = ["Brandon Hubbard <bhubbard@hubbardlabs.com>", "Frontlane Studio"]
description = "A fast, open-source SERP API and CLI in Rust for Google, Bing, DuckDuckGo, Yandex, Baidu, and Ecosia."
license = "MIT"
repository = "https://github.com/frontlanestudio/frontlane-serp"
homepage = "https://github.com/frontlanestudio/frontlane-serp"
keywords = ["serp", "search", "crawler", "scraper", "api"]
categories = ["web-programming::http-server", "command-line-utilities"]

[lib]
name = "frontlane_serp"
path = "src/lib.rs"

[[bin]]
name = "frontlane-serp"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "timeout"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "cookies", "gzip", "brotli", "socks", "multipart"] }
scraper = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
regex = "1.11"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "v7", "serde"] }
moka = { version = "0.12", features = ["future"] }
async-trait = "0.1"
futures = "0.3"
html2md = "0.2"
thiserror = "2.0"
base64 = "0.22"
md-5 = "0.11.0"
sha2 = "0.11.0"
hex = "0.4.3"

[features]
default = []
impersonate = ["dep:wreq", "dep:wreq-util"]

# Browser TLS/JA3 fingerprint impersonation (see src/core/impersonate.rs) --
# excluded on Windows. wreq vendors and compiles BoringSSL from source via
# boring-sys/cmake. When the `impersonate` feature is not enabled, frontlane-serp
# falls back to reqwest with standard TLS fingerprints.
[target.'cfg(not(windows))'.dependencies]
wreq = { version = "0.15.3", features = ["gzip", "brotli", "cookies", "socks", "json", "multipart"], optional = true }
wreq-util = { version = "0.1.0", optional = true }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.17"
http-body-util = "0.1"
