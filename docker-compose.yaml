services:
  frontlane-serp:
    container_name: frontlane-serp
    init: true
    shm_size: 2gb
    build:
      context: .
      dockerfile: Dockerfile
    image: frontlanestudio/frontlane-serp:latest
    ports:
      - "7000:7000"
    command: ["serve"]
    volumes:
      - ./config.yaml:/usr/src/app/config.yaml:ro
    environment:
      FRONT_SERP_SERVER_HOST: "0.0.0.0"
      FRONT_SERP_SERVER_PORT: 7000
      OPENSERP_SERVER_HOST: "0.0.0.0"
      OPENSERP_SERVER_PORT: 7000
