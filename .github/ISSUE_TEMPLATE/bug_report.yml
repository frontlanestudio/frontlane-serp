name: Bug report
description: Report a reproducible Frontlane SERP bug.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Reproducible reports are the fastest to fix.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the unexpected behavior and what you expected instead.
      placeholder: "Google search returns empty results for ..."
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How do we reproduce it?
      description: Include the exact command, request, config, and minimal input.
      placeholder: |
        1. Run `frontlane-serp serve`
        2. Request `curl "..."`
        3. See ...
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: Engine
      options:
        - google
        - yandex
        - baidu
        - bing
        - duckduckgo
        - ecosia
        - hackernews
        - github
        - crates
        - wikipedia
        - megasearch
        - not engine-specific
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Frontlane SERP version
      description: Paste `frontlane-serp --version`, the Docker tag, or the commit SHA.
      placeholder: "0.1.0 / commit SHA"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Rust version, Docker version, proxy setup if relevant.
      placeholder: "macOS 15, Rust 1.84, Docker, SOCKS5 proxy..."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or response body
      description: Paste relevant logs, stack traces, or API responses. Remove secrets and proxy credentials.
      render: shell
