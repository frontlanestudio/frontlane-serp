name: Release

# Publishes binary archives to the GitHub release for a version tag.
# Docker images are published separately by docker.yml on the same tag.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check tag matches Cargo.toml version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CODE_VERSION=$(sed -nE 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/p' Cargo.toml | head -n 1)
          echo "tag=v${TAG_VERSION} code=${CODE_VERSION}"
          if [ "$TAG_VERSION" != "$CODE_VERSION" ]; then
            echo "::error::Git tag v${TAG_VERSION} does not match version \"${CODE_VERSION}\" in Cargo.toml. Bump Cargo.toml before tagging."
            exit 1
          fi

  build-binaries:
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: frontlane-serp
            archive_ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: frontlane-serp
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: frontlane-serp.exe
            archive_ext: zip

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Binary (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          BIN="target/${{ matrix.target }}/release/${{ matrix.binary_name }}"
          ARCHIVE_NAME="frontlane-serp-${{ matrix.target }}-v${VERSION}.tar.gz"
          tar -czf "dist/${ARCHIVE_NAME}" -C "$(dirname "$BIN")" "${{ matrix.binary_name }}"

      - name: Package Binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          BIN="target/${{ matrix.target }}/release/${{ matrix.binary_name }}"
          ARCHIVE_NAME="frontlane-serp-${{ matrix.target }}-v${VERSION}.zip"
          7z a "dist/${ARCHIVE_NAME}" "./$BIN"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: dist/*
          retention-days: 1

  publish-release:
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate Changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            echo "## Changes"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "Commits since ${PREV_TAG}:"
              echo ""
              git log --no-merges --pretty='- %s' "${PREV_TAG}..${GITHUB_REF_NAME}"
            else
              git log --no-merges --pretty='- %s' "${GITHUB_REF_NAME}"
            fi
          } > release_notes.md
          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: release_notes.md
          generate_release_notes: true
